name: Generate Snake

on:
  # Run every day at 00:00 UTC so the snake stays fresh
  schedule:
    - cron: "0 0 * * *"

  # Allow manual trigger from the Actions tab
  workflow_dispatch:

  # Also regenerate whenever the main branch is pushed
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest

    permissions:
      contents: write   # needed to push the generated SVGs to the output branch

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Generate both a light-mode and a dark-mode snake SVG
      - name: Generate contribution snake (light + dark)
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?color_snake=%2390D5FF&color_dots=%23eaf6ff,%23b3e4ff,%2390D5FF,%2350b4e8,%231e8fbf
            dist/snake-dark.svg?palette=github-dark&color_snake=%2390D5FF&color_dots=%231a1f2e,%231e4d6b,%23286890,%2390D5FF,%23c8eeff

      # Push the generated files to the "output" branch so the README
      # can reference them via a raw GitHub URL without cluttering main.
      - name: Push snake SVGs to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
